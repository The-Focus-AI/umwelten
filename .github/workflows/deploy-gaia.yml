name: Deploy Gaia host

# Continuous deploy of the single-container `pi-durable` Gaia HabitatHost
# (see deploy/gaia/README.md). Runs on the self-hosted runner on the Gaia VM.
#
# Push-to-main only — never wire this runner to pull_request triggers: the
# repo is public and the runner drives the production docker daemon.
on:
  push:
    branches: [main]
    paths:
      - "packages/habitat/**"
      - "packages/pi/**"
      - "packages/protocols/**"
      - "packages/cli/**"
      - "packages/umwelten/**"
      - "deploy/gaia/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-gaia.yml"
  workflow_dispatch:

concurrency:
  group: gaia-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Redeploy Gaia HabitatHost (pi-durable)
        env:
          GAIA_ENV_FILE: /home/worker_user/umwelten/deploy/gaia/.env
        run: |
          chmod +x deploy/gaia/redeploy.sh
          deploy/gaia/redeploy.sh
