name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        # pnpm/action-setup@v6.0.9 refuses to accept both `version:` here and
        # `packageManager` in package.json. Let package.json drive the version.
        uses: pnpm/action-setup@v6.0.9
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # pnpm 11 (declared in package.json packageManager) needs Node 22.13+
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install and build the isolated Mycel client
        run: |
          pnpm --dir apps/mycel-client install --frozen-lockfile
          pnpm --dir apps/mycel-client build
      - name: Run unit tests
        run: pnpm test:run
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run lint
        run: pnpm lint

      # The unit suite runs against `src/`, so it cannot see the published
      # artifact at all. The one thing every user does first — run the binary —
      # went untested until a workspace dependency that no manifest declared got
      # inlined into the ESM bundle and `umwelten --help` began throwing
      # "Dynamic require of \"events\" is not supported". Green tests, broken
      # release.
      #
      # So: build what ships, then run it. `--help` exercises the whole import
      # graph, which is where a bundling fault lands.
      - name: Build the published package
        run: pnpm -r build
      - name: Smoke-test the published binary
        run: node packages/umwelten/dist/cli/entry.js --help

      # The Exchange ships as its own bundle with its own tsup config — a
      # different artifact from the npm package, and it broke the same way and
      # separately: `ws` inlined into ESM, `require()` rewritten to a stub that
      # throws at import. The container then died on boot, and the first thing
      # that noticed was deploy.sh's health check on the production host.
      #
      # `--help` is enough, because an import-time fault kills every command.
      - name: Smoke-test the Exchange bundle
        run: node packages/mycel/dist/mycel.js --help
      - name: Smoke-test the Exchange image and client surface
        run: |
          set -euo pipefail
          docker build -t mycel-ci -f packages/mycel/Dockerfile .
          docker run -d --name mycel-ci -p 127.0.0.1:17438:7438 \
            mycel-ci node /app/mycel.js serve --ephemeral
          trap 'docker rm -f mycel-ci >/dev/null 2>&1 || true' EXIT
          deadline=$((SECONDS + 30))
          until curl -fsS http://127.0.0.1:17438/health | grep -q '"status":"ok"'; do
            if ((SECONDS >= deadline)); then
              docker logs mycel-ci
              exit 1
            fi
            sleep 1
          done
          curl -fsS -o /tmp/mycel-landing.html http://127.0.0.1:17438/
          grep -q 'Mycel — intelligence grows in networks' /tmp/mycel-landing.html
          asset="$(sed -n 's/.*src="\([^"]*\/assets\/[^"]*\.js\)".*/\1/p' \
            /tmp/mycel-landing.html | head -1)"
          test -n "$asset"
          curl -fsS -o /tmp/mycel-mycelium.js "http://127.0.0.1:17438$asset"
          grep -q 'requestAnimationFrame' /tmp/mycel-mycelium.js
          curl -fsS -o /tmp/mycel-manifest.json \
            http://127.0.0.1:17438/shell/manifest.json
          grep -q 'catalogue-stats' /tmp/mycel-manifest.json
          curl -fsS -o /tmp/mycel-substrate.js \
            http://127.0.0.1:17438/shell/substrate/index.js
          grep -q 'export' /tmp/mycel-substrate.js
