name: Deploy umwelten.thefocus.ai site

on:
  # Builds the ../labs-styled Model Watch, Labs, Examples & Architecture site
  # (`pnpm run site:build` -> `build/site`) and publishes to GitHub Pages.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "reports/data/**"
      - "examples/**"
      - "docs/decisions.jsonl"
      - "docs/specs/**"
      - "docs/runs/**"
      - "presentations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        # pnpm/action-setup@v6 refuses to accept both `version:` here and
        # `packageManager` in package.json. Let package.json drive the version.
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Model Watch & Prompt-First Examples site
        run: pnpm run site:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  # Deployment job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
