name: Production topology preflight

# Read-only inspection for operator-approved production work without SSH keys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, gaia]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Inspect Gaia HabitatHost topology without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE=/home/worker_user/umwelten/deploy/gaia/.env
          echo "revision=$(git rev-parse --short HEAD)"
          echo "containers:"
          docker ps --format '  {{.Names}} | {{.Image}} | {{.Status}}'
          echo "gaia networks:"
          docker inspect --format '  {{range $name, $_ := .NetworkSettings.Networks}}{{$name}} {{end}}' gaia || true
          echo "config presence:"
          for key in GAIA_HOSTNAME GAIA_API_KEY GAIA_JWKS_URL MYCEL_URL MYCEL_API_KEY; do
            if [[ -f "$ENV_FILE" ]] && grep -Eq "^${key}=.+" "$ENV_FILE"; then
              echo "  $key=set"
            else
              echo "  $key=missing"
            fi
          done
          echo "gaia recent logs:"
          docker logs --tail 25 gaia 2>&1 || true
