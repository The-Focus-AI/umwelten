<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Browser</title>
<style>
  :root {
    --bg: #14171d; --panel: #1c2129; --line: #2b323d; --ink: #e6e9ee;
    --dim: #9aa4b2; --accent: #7aa2f7; --ok: #9ece6a; --warn: #e0af68; --err: #f7768e;
    --mcp: #7aa2f7; --a2a: #bb9af7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 380px 1fr; height: 100vh;
  }
  h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: .02em; }
  h2 { font-size: 12px; margin: 18px 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  #side { border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; background: var(--panel); }
  #main { display: flex; flex-direction: column; height: 100vh; }
  input[type=text], input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; margin-bottom: 8px;
  }
  button {
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
    background: #232a35; color: var(--ink); font: inherit;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #10131a; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; }
  .card {
    border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 10px;
    background: var(--bg);
  }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
    letter-spacing: .05em;
  }
  .badge.mcp { background: color-mix(in srgb, var(--mcp) 22%, transparent); color: var(--mcp); }
  .badge.a2a { background: color-mix(in srgb, var(--a2a) 22%, transparent); color: var(--a2a); }
  .badge.auth-open { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .badge.auth-bearer { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .badge.auth-oauth-required { background: color-mix(in srgb, var(--err) 20%, transparent); color: var(--err); }
  .cap { font-size: 12px; color: var(--dim); margin: 3px 0; }
  .cap b { color: var(--ink); font-weight: 600; }
  .muted { color: var(--dim); font-size: 12px; }
  .error { color: var(--err); font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
  #endpoints .card { position: relative; }
  #endpoints .remove {
    position: absolute; top: 8px; right: 8px; border: none; background: none;
    color: var(--dim); font-size: 15px; padding: 2px 6px;
  }
  #transcript { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .msg { max-width: 780px; margin: 0 auto 14px; }
  .msg .who { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
  .msg .body { white-space: pre-wrap; }
  .msg.user .body { color: var(--accent); }
  .tools { margin-top: 5px; }
  .tools span {
    display: inline-block; font-size: 11px; font-family: ui-monospace, monospace;
    background: #232a35; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 7px; margin: 2px 4px 0 0; color: var(--warn);
  }
  .ui-resource { margin-top: 8px; }
  .ui-resource .ui-label { font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace; margin-bottom: 3px; }
  .ui-resource iframe {
    width: 100%; max-width: 560px; height: 320px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel);
  }
  #composer { border-top: 1px solid var(--line); padding: 14px 24px; }
  #composer .inner { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; }
  #composer input { flex: 1; margin: 0; }
  #status { font-size: 12px; color: var(--dim); padding: 6px 24px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .spin { color: var(--warn); }
</style>
</head>
<body>
  <div id="side">
    <h1>Agent Browser</h1>
    <div class="muted">Paste an MCP server URL or an A2A agent URL. Discovery reads its card; connecting adds its tools to the chat.</div>
    <h2>Discover</h2>
    <input type="text" id="url" placeholder="https://…/mcp or https://agent.example.com" autocomplete="off">
    <input type="password" id="token" placeholder="Bearer token (optional)" autocomplete="off">
    <div class="row">
      <button id="discover">Discover</button>
      <button id="connect" class="primary" disabled>Add to chat</button>
    </div>
    <div id="discover-error" class="error" hidden></div>
    <div id="preview" hidden></div>
    <h2>Connected</h2>
    <div id="endpoints"><div class="muted">Nothing connected yet.</div></div>
  </div>

  <div id="main">
    <div id="transcript"></div>
    <div id="composer">
      <div class="inner">
        <input type="text" id="message" placeholder="Ask something — tools from every connected endpoint are available" autocomplete="off">
        <button id="send" class="primary">Send</button>
        <button id="reset" title="Clear chat and start a new A2A context">Reset</button>
      </div>
    </div>
    <div id="status"><span id="model"></span><span id="busy"></span></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let discovered = null;

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: body ? { "content-type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function cardHtml(card, { removable, id } = {}) {
  const caps = (card.capabilities || []).map(c =>
    `<div class="cap"><b>${esc(c.name)}</b>${c.description ? " — " + esc(c.description) : ""}</div>`
  ).join("") || `<div class="muted">No ${card.kind === "mcp" ? "tools listed" : "skills listed"}.</div>`;
  const capLabel = card.kind === "mcp" ? "Tools" : "Skills";
  return `<div class="card">
    ${removable ? `<button class="remove" data-id="${esc(id)}" title="Disconnect">×</button>` : ""}
    <div>
      <span class="badge ${card.kind}">${card.kind.toUpperCase()}</span>
      <span class="badge auth-${card.auth}">${card.auth.replace("-", " ")}</span>
      ${card.streaming ? '<span class="badge a2a">streaming</span>' : ""}
    </div>
    <div style="margin-top:8px"><b>${esc(card.name)}</b>${card.version ? ` <span class="muted">v${esc(card.version)}</span>` : ""}</div>
    ${card.description ? `<div class="muted" style="margin-top:2px">${esc(card.description)}</div>` : ""}
    <div class="muted" style="margin-top:6px; font-family:ui-monospace,monospace; font-size:11px; word-break:break-all">${esc(card.url)}</div>
    <h2>${capLabel} (${(card.capabilities || []).length})</h2>
    ${caps}
  </div>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderState(s) {
  $("model").textContent = `${s.model.provider}/${s.model.name} · context ${s.contextId.slice(0, 8)}`;
  const eps = s.endpoints || [];
  $("endpoints").innerHTML = eps.length
    ? eps.map((ep) => cardHtml(ep.card, { removable: true, id: ep.id })).join("")
    : '<div class="muted">Nothing connected yet.</div>';
  for (const btn of document.querySelectorAll("#endpoints .remove")) {
    btn.onclick = async () => renderState(await api("/api/disconnect", { id: btn.dataset.id }));
  }
  const t = $("transcript");
  t.innerHTML = (s.transcript || []).map((m) => `<div class="msg ${m.role}">
      <div class="who">${m.role}</div>
      <div class="body">${esc(m.text)}</div>
      ${m.toolCalls?.length ? `<div class="tools">${m.toolCalls.map((c) => `<span>${esc(c)}</span>`).join("")}</div>` : ""}
      ${(m.ui || []).map((u) => `<div class="ui-resource">
        <div class="ui-label">${esc(u.tool)}${u.uri ? " · " + esc(u.uri) : ""}</div>
        <iframe sandbox="allow-scripts" data-uri="${esc(u.uri || "")}" srcdoc="${esc(u.html)}"></iframe>
      </div>`).join("")}
    </div>`).join("");
  t.scrollTop = t.scrollHeight;
}

function busy(label) {
  $("busy").innerHTML = label ? `<span class="spin">${esc(label)}</span>` : "";
  for (const id of ["discover", "connect", "send", "reset"]) $(id).disabled = Boolean(label);
  if (!label) $("connect").disabled = !discovered;
}

$("discover").onclick = async () => {
  $("discover-error").hidden = true;
  $("preview").hidden = true;
  discovered = null;
  busy("discovering…");
  try {
    const { card } = await api("/api/discover", { url: $("url").value.trim(), token: $("token").value.trim() || undefined });
    discovered = card;
    $("preview").innerHTML = cardHtml(card);
    $("preview").hidden = false;
    if (card.auth === "oauth-required") {
      $("preview").innerHTML += '<div class="muted" style="margin-top:6px">This server wants OAuth. “Add to chat” will start the flow — a browser window opens on the machine running this server.</div>';
    }
  } catch (err) {
    $("discover-error").textContent = err.message;
    $("discover-error").hidden = false;
  } finally {
    busy(null);
  }
};

$("connect").onclick = async () => {
  busy("connecting… (OAuth may open a browser on the server host)");
  $("discover-error").hidden = true;
  try {
    renderState(await api("/api/connect", { url: $("url").value.trim(), token: $("token").value.trim() || undefined }));
    $("preview").hidden = true;
    $("url").value = ""; $("token").value = "";
    discovered = null;
  } catch (err) {
    $("discover-error").textContent = err.message;
    $("discover-error").hidden = false;
  } finally {
    busy(null);
  }
};

async function send() {
  const message = $("message").value.trim();
  if (!message) return;
  $("message").value = "";
  busy("thinking…");
  try {
    renderState(await api("/api/chat", { message }));
  } catch (err) {
    const t = $("transcript");
    t.innerHTML += `<div class="msg"><div class="error">${esc(err.message)}</div></div>`;
  } finally {
    busy(null);
  }
}
$("send").onclick = send;
$("message").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
$("reset").onclick = async () => renderState(await api("/api/reset", {}));

// Host side of the widget bridge (the MCP Apps pattern in miniature): a
// sandboxed widget posts { type: "ui-tool-call", id, tool, args } to this
// page, the page runs the tool through the chat server — which also tells
// the model what happened — and the fresh widget replaces the old one.
window.addEventListener("message", async (e) => {
  const m = e.data;
  if (!m || m.type !== "ui-tool-call" || typeof m.tool !== "string") return;
  const iframe = [...document.querySelectorAll(".ui-resource iframe")]
    .find((f) => f.contentWindow === e.source);
  try {
    const res = await api("/api/ui-tool", {
      tool: m.tool,
      args: m.args ?? {},
      uri: iframe?.dataset.uri || undefined,
    });
    e.source?.postMessage({ type: "ui-tool-result", id: m.id, ok: res.success !== false }, "*");
    renderState(res); // transcript row updated in place server-side
  } catch (err) {
    e.source?.postMessage(
      { type: "ui-tool-result", id: m.id, ok: false, error: err.message || String(err) },
      "*",
    );
  }
});

api("/api/state").then(renderState).catch(() => {});
</script>
</body>
</html>
