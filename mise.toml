[tools]
node = "24"
"npm:@earendil-works/pi-coding-agent" = "latest"

[tasks.specs]
description = "Validate modular specifications, decisions, and verification runs"
run = "pnpm run specs:check"

[tasks.verify]
description = "Run typecheck, contract tests, lint, and spec validation"
run = ["pnpm run specs:check", "pnpm typecheck", "pnpm test:run", "pnpm lint"]

[tasks."habitat-serve"]
description = "Start HabitatHost (multi-Habitat pi-durable + A2A 1.0 server on :7430)"
dir = "{{ config_root }}"
run = "dotenvx run -- pnpm run cli -- habitat serve --port 7430 --data-dir ./habitats-data"

[tasks.explorations]
description = "List projected Explorations across Pi, Pi Durable, Claude Code, and Cursor"
dir = "{{ config_root }}"
run = "pnpm run cli -- sessions explorations"
