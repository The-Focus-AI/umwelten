# Mycel — the Exchange.
#
# Runs on its own GCE instance (`mycel-host`) with its own service account,
# NOT as a container on gaia-host. The reasoning is ADR 0030: every container
# on a Docker host can reach the metadata server and assume that instance's
# identity, and gaia-host runs habitat containers executing arbitrary agent
# code. Sharing a box would hand the money ledger's credentials to every one of
# them by construction.
#
# Secrets come from Google Secret Manager, resolved by the entrypoint through
# the instance's attached service account. There is no key file, no fnox, no
# bootstrap token, and no secret in this file or in any .env beside it — see
# MYCEL_SECRETS below.
#
# Prereqs (once, on mycel-host):
#   deploy/gcp/mycel-host-startup.sh   provisions docker + the network
#   docker build -t mycel -f packages/mycel/Dockerfile .
#   an A record for MYCEL_HOSTNAME → this instance's static IP
#
# Runbook: deploy/mycel/README.md · design: docs/architecture/mycel-deployment.md

services:
  mycel:
    image: mycel
    container_name: mycel
    restart: unless-stopped
    networks:
      - mycel-net
    environment:
      MYCEL_PORT: ${MYCEL_PORT:-7438}
      # Environment-variable name → Secret Manager secret id. Names only, so
      # this is not itself a secret; the values never touch disk. Each id must
      # be granted to this instance's service account on the secret resource
      # rather than project-wide (STD-007 §3.12).
      #
      # A Supplier record stores the NAME of one of these upstream keys, never
      # the value — so a database compromise yields nothing that can spend.
      # Stage 1 buys from OpenRouter only. Every id listed here must exist in
      # Secret Manager and be readable by this instance's service account — a
      # missing one stops the boot rather than starting a service that cannot
      # meter, so this list grows only when the secret does. Add
      # GOOGLE_GENERATIVE_AI_API_KEY=mycel-google-generative-ai-api-key when a
      # Google Supplier is registered.
      MYCEL_SECRETS: >-
        MYCEL_DATABASE_URL=mycel-database-url,
        OPENROUTER_API_KEY=mycel-openrouter-api-key
    labels:
      caddy: ${MYCEL_HOSTNAME:-mycel.localhost}
      caddy.reverse_proxy: "{{upstreams 7438}}"

  # This host's own ingress. On gaia-host the equivalent service fronts Gaia and
  # every habitat it spawns; here it fronts exactly one container, which is the
  # point — mycel-host has no other tenants.
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine
    container_name: mycel-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_INGRESS_NETWORKS: mycel-net
      CADDY_DOCKER_CADDYFILE_EMAIL: ${CADDY_EMAIL:-}
    networks:
      - mycel-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy-data:/data # certificates — persist across restarts
      - caddy-config:/config

networks:
  # Created by the startup script. External for the same reason gaia-net is:
  # so the literal name is pinned and no compose project prefix appears.
  mycel-net:
    name: mycel-net
    external: true

volumes:
  caddy-data:
  caddy-config:
