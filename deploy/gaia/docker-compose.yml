# Gaia HabitatHost — Single-Container `pi-durable` Deployment.
#
# Multiplexes SQLite-backed DurableHabitats under `/opt/gaia-data/habitats/<id>/habitat.sqlite`
# behind Caddy TLS at `https://$GAIA_HOSTNAME` with zero Docker socket privileges
# and zero child containers.

services:
  gaia:
    image: habitat
    container_name: gaia
    restart: unless-stopped
    init: true
    networks:
      - gaia-net
    environment:
      GAIA_HOSTNAME: ${GAIA_HOSTNAME:-}
      GAIA_PORT: ${GAIA_PORT:-7420}
      PORT: ${GAIA_PORT:-7420}
      HABITAT_WORK_DIR: /data
      GAIA_PROVIDER: ${GAIA_PROVIDER:-mycel}
      GAIA_MODEL: ${GAIA_MODEL:-default}
      GAIA_API_KEY: ${GAIA_API_KEY:-}
      GAIA_BASE_DOMAIN: ${GAIA_BASE_DOMAIN:-}
      GAIA_JWKS_URL: ${GAIA_JWKS_URL:-}
      GAIA_AUTH_AUDIENCE: ${GAIA_AUTH_AUDIENCE:-}
      MYCEL_URL: ${MYCEL_URL:-https://mycel.thefocus.ai}
      MYCEL_API_KEY: ${MYCEL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    labels:
      caddy: ${GAIA_HOSTNAME:-gaia.localhost}
      caddy.reverse_proxy: "{{upstreams 7420}}"
    volumes:
      - /opt/gaia-data:/data

networks:
  gaia-net:
    name: gaia-net
    external: true
